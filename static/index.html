<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EstateBot — Database Real Estate Bot</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="avatar-bot small">
        <span class="bot-emoji">🏠</span>
      </div>
      <div class="brand-text">
        <h1>ESTATEBOT</h1>
        <p id="status" class="status">Connecting…</p>
      </div>
    </div>
    <button id="newChat" class="ghost-btn">New chat</button>
  </header>

  <main id="messages" class="messages">
    <div class="welcome">
      <div class="hero">
        <div class="hero-icon">🏠</div>
        <h2>Hi, I'm EstateBot</h2>
        <p class="hero-sub">I answer real-estate questions from a local SQLite database.</p>
        <div class="badges">
          <span class="badge">🏙️ City prices</span>
          <span class="badge">💸 Rent ranges</span>
          <span class="badge">🧭 Buying roadmap</span>
        </div>
      </div>

      <div class="suggestions">
        <button class="chip" data-prompt="What is the price of a 2 BHK in Mumbai?">2 BHK price in Mumbai</button>
        <button class="chip" data-prompt="What is the rent in Bengaluru?">Rent in Bengaluru</button>
        <button class="chip" data-prompt="How do I buy a flat in Delhi?">How to buy in Delhi</button>
        <button class="chip" data-prompt="What is the stamp duty in Maharashtra?">Stamp duty in Maharashtra</button>
        <button class="chip" data-prompt="What documents do I need to buy property?">Documents needed</button>
        <button class="chip" data-prompt="What is RERA?">What is RERA?</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <form id="form" class="input-row">
      <textarea id="input" rows="1" placeholder="Ask about prices, rent, stamp duty or the buying process…"></textarea>

      <button type="submit" id="send" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
    <p class="hint">Enter to send · Shift + Enter for a new line</p>
  </footer>

</div>
<script src="/static/app.js"></script>
</body>
</html>
